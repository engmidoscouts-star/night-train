<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starlight Express</title><style>body{margin:0;background:#08051b;color:white;font-family:system-ui;overflow:hidden}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08051be9;text-align:center;z-index:4}#overlay>div{padding:24px}h1{font-size:clamp(30px,6vw,64px);margin:0;color:#f7c9ff;text-shadow:0 0 25px #aa54d5}p{line-height:1.6}button{background:#a55bc7;color:white;border:1px solid #e5baff;border-radius:30px;padding:12px 20px;cursor:pointer;font:inherit}#hud{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 48px));background:#160c35dd;border:1px solid #b67ae6;border-radius:22px;padding:20px;text-align:center;backdrop-filter:blur(10px)}#hud h2{margin:0}#hud button{margin:4px}#hint{position:absolute;top:20px;left:20px;color:#e6c9f5;font-size:13px}canvas{display:block}</style></head><body><div id="overlay"><div><h1>Starlight Express ✨</h1><p>A magical night train through our memories.</p><button id="start">Begin Our Journey</button></div></div><div id="hint">Drag to look around · Tap a carriage</div><div id="hud"><h2 id="title"></h2><p id="message"></p><button id="prev">← Previous</button><button id="next">Next →</button></div><script type="module">import * as T from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';const s=new T.Scene();s.background=new T.Color('#08051b');s.fog=new T.FogExp2('#08051b',.012);const c=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,400);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(r.domElement);s.add(new T.AmbientLight(0xb9a5ff,1.8));const l=new T.PointLight(0xffa6e9,120,70);l.position.set(0,12,7);s.add(l);const moon=new T.Mesh(new T.SphereGeometry(3,32,32),new T.MeshBasicMaterial({color:0xffe4fb}));moon.position.set(-25,22,-45);s.add(moon);const pts=[];for(let i=0;i<1900;i++)pts.push((Math.random()-.5)*230,Math.random()*105-8,(Math.random()-.5)*230);const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pts,3));s.add(new T.Points(g,new T.PointsMaterial({color:0xf5dbff,size:.19})));const train=new T.Group();s.add(train);const purple=new T.MeshStandardMaterial({color:0x57348c,metalness:.5,roughness:.3}),roof=new T.MeshStandardMaterial({color:0xba85e7,metalness:.4}),windowMat=new T.MeshBasicMaterial({color:0xffd6f3}),dark=new T.MeshStandardMaterial({color:0x1b102b});function cube(parent,w,h,d,x,y,z,mat){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}const cars=[];for(let i=0;i<4;i++){const car=new T.Group();car.position.x=(i-1.5)*5.5;train.add(car);cube(car,4.8,2.8,3,0,2.3,0,purple);cube(car,5.1,.45,3.3,0,3.95,0,roof);for(let j=-1;j<=1;j++)for(const z of [-1.53,1.53])cube(car,.9,1,.08,j*1.35,2.65,z,windowMat);for(const x of [-1.6,1.6])for(const z of [-1.2,1.2]){const w=new T.Mesh(new T.CylinderGeometry(.5,.5,.2,20),dark);w.rotation.x=Math.PI/2;w.position.set(x,.65,z);car.add(w)}cars.push(car)}for(const z of [-1.25,1.25])cube(s,32,.1,.15,0,.15,z,roof);const memories=[['The First Spark','Every beautiful story begins with one magical moment.'],['Our Little Universe','Some memories shine brighter than a thousand stars.'],['Wishes & Dreams','The best chapters of our story are still waiting for us.'],['The Last Station','Wherever this train takes us, my favorite destination is you.']];let current=0,angle=.5,drag=false,last=0,moved=false;function choose(n){current=(n+4)%4;document.querySelector('#title').textContent=memories[current][0];document.querySelector('#message').textContent=memories[current][1];cars.forEach((car,i)=>car.scale.setScalar(i===current?1.05:1))}document.querySelector('#prev').onclick=()=>choose(current-1);document.querySelector('#next').onclick=()=>choose(current+1);document.querySelector('#start').onclick=()=>document.querySelector('#overlay').remove();r.domElement.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;moved=false});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){if(Math.abs(e.clientX-last)>3)moved=true;angle+=(e.clientX-last)*.006;last=e.clientX}});r.domElement.addEventListener('click',e=>{if(moved)return;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),c);const hits=ray.intersectObjects(cars,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!cars.includes(obj))obj=obj.parent;const idx=cars.indexOf(obj);if(idx>=0)choose(idx)}});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});function animate(t){requestAnimationFrame(animate);train.position.y=Math.sin(t*.0009)*.12;c.position.set(Math.sin(angle)*28,11,Math.cos(angle)*28);c.lookAt(0,2,0);r.render(s,c)}choose(0);animate(0);</script></body></html>
